<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>crypto_dca — {{ d.symbol }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115; --panel: #171a21; --line: #262b36;
      --fg: #e6e9ef; --muted: #8b93a7; --pos: #3fb950; --neg: #f85149;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    header {
      display: flex; align-items: baseline; gap: 12px;
      flex-wrap: wrap; margin-bottom: 20px;
    }
    h1 { font-size: 22px; margin: 0; }
    .pill {
      font-size: 13px; padding: 2px 10px; border-radius: 999px;
      border: 1px solid var(--line);
    }
    .pill.run { color: var(--pos); border-color: var(--pos); }
    .pill.pause { color: var(--neg); border-color: var(--neg); }
    .muted { color: var(--muted); font-size: 13px; }
    .grid {
      display: grid; gap: 12px; margin-bottom: 20px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px;
    }
    .card .label { color: var(--muted); font-size: 12px; }
    .card .value { font-size: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .pos { color: var(--pos); } .neg { color: var(--neg); }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    th:first-child, td:first-child { text-align: left; }
    .empty { color: var(--muted); padding: 16px 0; }
    .gen { margin-top: 12px; }
    .feed-wrap { margin-top: 24px; }
    .feed-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neg); }
    .dot.on { background: var(--pos); }
    #feed {
      max-height: 240px; overflow-y: auto; border: 1px solid var(--line);
      border-radius: 10px; background: var(--panel);
    }
    .ev {
      padding: 6px 12px; border-bottom: 1px solid var(--line);
      font-size: 13px; font-variant-numeric: tabular-nums;
    }
    .ev:last-child { border-bottom: none; }
    .ev .t { color: var(--muted); margin-right: 10px; }
    .ev .k { color: var(--accent); }
    .feed-empty { padding: 12px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<div class="wrap">
  <div id="snapshot">
    {% include "_snapshot.html" %}
  </div>

  <div class="feed-wrap">
    <div class="feed-head">
      <span id="dot" class="dot"></span>
      <span class="muted">Live events</span>
    </div>
    <div id="feed"><div class="feed-empty">waiting for events…</div></div>
  </div>
</div>

<script>
(function () {
  const snap = document.getElementById("snapshot");
  const feed = document.getElementById("feed");
  const dot = document.getElementById("dot");
  let empty = true;

  async function refresh() {
    try {
      const html = await (await fetch("/fragment")).text();
      snap.innerHTML = html;
    } catch (e) { /* keep last snapshot on transient error */ }
  }

  function addEvent(ev) {
    if (empty) { feed.innerHTML = ""; empty = false; }
    const row = document.createElement("div");
    row.className = "ev";
    const t = new Date((ev.ts || 0) * 1000).toLocaleTimeString();
    let detail = "";
    try { detail = JSON.stringify(ev.payload || {}); } catch (e) {}
    row.innerHTML =
      '<span class="t"></span><span class="k"></span> <span class="d"></span>';
    row.querySelector(".t").textContent = t;
    row.querySelector(".k").textContent = ev.type || "event";
    row.querySelector(".d").textContent = detail;
    feed.prepend(row);
    while (feed.children.length > 50) feed.removeChild(feed.lastChild);
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(proto + "//" + location.host + "/ws");
    ws.onopen = () => dot.classList.add("on");
    ws.onmessage = (e) => {
      try { addEvent(JSON.parse(e.data)); } catch (err) {}
      refresh();
    };
    ws.onclose = () => { dot.classList.remove("on"); setTimeout(connect, 3000); };
    ws.onerror = () => ws.close();
  }

  connect();
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
